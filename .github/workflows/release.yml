name: Release Desktop Builds

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies 📥
        run: npm ci

      - name: Run Unit Tests 🧪
        run: npm test

      - name: Install Linux Dependencies 🐧
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Setup Rust 🦀
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache ⚡
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format Check 📐
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy 🔍
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Tests & Golden Parity 🧪
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 bundles a modern webkit2gtk — the 22.04 build's webkit fails
          # EGL display creation ("EGL_BAD_PARAMETER") on Wayland/AMD hosts
          - platform: ubuntu-24.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust 🦀
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache ⚡
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies 🐧
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: AppImage Build Workarounds 🔧
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install dependencies 📥
        run: npm ci

      - name: Build & Release 🚀
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Yakuake Skin Generator ${{ github.ref_name }}"
          releaseBody: "Desktop builds of the Yakuake Skin Generator. Install the skin archives or use the app to generate and install skins natively."
          releaseDraft: false
          prerelease: false

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate SHA256 checksums 📝
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --dir artifacts --clobber
          cd artifacts
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo "Checksums uploaded:"
          cat SHA256SUMS.txt
