name: Release Desktop Builds

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies 📥
        run: npm i

      - name: Run Unit Tests 🧪
        run: npm test

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust 🦀
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache ⚡
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies 🐧
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: AppImage Build Workarounds 🔧
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install dependencies 📥
        run: npm i

      - name: Build & Release 🚀
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Yakuake Skin Generator ${{ github.ref_name }}"
          releaseBody: "Desktop builds of the Yakuake Skin Generator. Install the skin archives or use the app to generate and install skins natively."
          releaseDraft: false
          prerelease: true
