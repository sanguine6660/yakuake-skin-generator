name: Test Build

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies 📥
        run: npm i

      - name: Run Unit Tests 🧪
        run: npm test

      - name: Run TypeScript Check & Build 🛠️
        run: npm run build
