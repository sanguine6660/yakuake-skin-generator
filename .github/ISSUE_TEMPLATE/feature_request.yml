name: ✨ Feature Request
description: Suggest an idea or new functionality for the generator
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem you are trying to
        solve and what you would like the generator to do.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to achieve? What is missing or frustrating?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? A clear and concise description of the desired behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have thought about.

  - type: dropdown
    id: environment
    attributes:
      label: Where would this be used?
      options:
        - Web (browser)
        - Desktop app (Tauri)
        - Both
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Mockups, links to similar features in other tools, anything else.
