name: 🎨 Preset Request
description: Suggest a new color theme preset for the generator
labels: ["preset", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new color theme! Presets are palette-based: they derive
        the title text, tab text and button state colors automatically
        from four colors — so make sure the colors work together.

  - type: input
    id: name
    attributes:
      label: Preset name
      description: e.g. Tokyo Night Storm
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - dark
        - light
    validations:
      required: true

  - type: input
    id: bg
    attributes:
      label: Background color
      description: Hex value — the main terminal/tab bar background
      placeholder: "#1a1b26"
    validations:
      required: true

  - type: input
    id: selected
    attributes:
      label: Selected/Accent color
      description: Hex value — the selected tab background
      placeholder: "#24283b"
    validations:
      required: true

  - type: input
    id: text
    attributes:
      label: Text color
      description: Hex value — tab labels, title text and button icons
      placeholder: "#7aa2f7"
    validations:
      required: true

  - type: input
    id: dim
    attributes:
      label: Dim color
      description: Hex value — inactive elements
      placeholder: "#16161e"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated — e.g. modern, pastel, neon, retro, minimal
      placeholder: "modern, cool"

  - type: input
    id: reference
    attributes:
      label: Reference
      description: Link to a VS Code theme, editor theme or screenshot this is based on.

  - type: textarea
    id: context
    attributes:
      label: Additional context
